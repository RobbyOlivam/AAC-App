name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to publish the "latest" release APK on main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (shared core)
        run: ./gradlew :core:test --stacktrace

      - name: Screen tests (Robolectric + screenshots)
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: aac-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Tablets (Fire's Silk browser) can't install from the zipped artifact above, so every
      # build of main also replaces the "latest" release with the plain APK.
      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk aac-app.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest aac-app.apk \
            --title "Latest build ($version)" \
            --notes "Built from ${GITHUB_SHA::7} on main. On a phone or Fire tablet, tap aac-app.apk to download and install it (it updates the app in place; your boards stay)." \
            --target "$GITHUB_SHA" --prerelease
