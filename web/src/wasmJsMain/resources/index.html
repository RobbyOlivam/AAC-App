<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AAC Talk</title>
  <!-- iPad: full screen when added to the Home Screen; no zooming or bouncing while talking. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AAC Talk">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2E7D6B">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
    @media (prefers-color-scheme: dark) { html, body { background: #121212; } }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 600 22px -apple-system, system-ui, sans-serif; color: #2E7D6B; }
  </style>
  <script src="platform.js"></script>
  <script src="aac.js" defer></script>
</head>
<body><div id="loading">AAC Talk is starting…</div></body>
</html>
